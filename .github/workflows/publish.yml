name: npm package

on:
  release:
    types: [published]

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Test package
        run: bun test

      - name: Build package
        run: bun run build

      - name: Publish to npm
        run: bun publish ./dist/*.tgz
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
